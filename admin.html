<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>明德里 2.0 競選總部｜提案與有問必答管理後台</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css?v=7.04">
    <style>
    /* 後台專屬工作區樣式 */
    .admin-body {
        background: #080d0b;
        color: #f5f5f4;
        min-height: 100vh;
    }

    .admin-navbar {
        background: #0d1613;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0.9rem 1.5rem;
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .admin-nav-left {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .admin-badge-title {
        background: rgba(251, 191, 36, 0.15);
        border: 1px solid #fbbf24;
        color: #fbbf24;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
    }

    .admin-nav-right {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }

    .btn-admin-action {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-size: 0.88rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border: none;
    }

    .btn-admin-primary {
        background: var(--accent-primary);
        color: #0b1411;
    }

    .btn-admin-primary:hover {
        background: #f59e0b;
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
    }

    .btn-admin-sync {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid #10b981;
        color: #34d399;
    }

    .btn-admin-sync:hover {
        background: #10b981;
        color: #0b1411;
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .btn-admin-logout {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid #ef4444;
        color: #f87171;
    }

    .btn-admin-logout:hover {
        background: #ef4444;
        color: #ffffff;
    }

    /* 登入視窗 */
    .admin-login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(4, 8, 6, 0.92);
        backdrop-filter: blur(16px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }

    .admin-login-card {
        width: 100%;
        max-width: 440px;
        background: #111c18;
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 20px;
        padding: 2.5rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        text-align: center;
    }

    .admin-login-card h2 {
        color: var(--accent-primary);
        font-size: 1.5rem;
        margin-bottom: 0.6rem;
    }

    .admin-login-card p {
        color: var(--text-secondary);
        font-size: 0.92rem;
        margin-bottom: 1.8rem;
    }

    /* 主工作台雙欄排版 */
    .admin-workspace {
        max-width: 1560px;
        margin: 1.5rem auto;
        padding: 0 1.2rem;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 1.5rem;
    }

    @media (max-width: 1024px) {
        .admin-workspace {
            grid-template-columns: 1fr;
        }
    }

    /* 左側清單欄 */
    .admin-list-panel {
        background: #0f1915;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 120px);
        position: sticky;
        top: 80px;
    }

    @media (max-width: 1024px) {
        .admin-list-panel {
            height: auto;
            position: relative;
            top: 0;
        }
    }

    .admin-filter-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    .admin-filter-btn {
        flex: 1;
        padding: 0.5rem;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
    }

    .admin-filter-btn.active {
        background: rgba(251, 191, 36, 0.15);
        border-color: #fbbf24;
        color: #fbbf24;
    }

    .admin-search-input {
        width: 100%;
        padding: 0.7rem 1rem;
        background: #080d0b;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #ffffff;
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }

    .admin-cards-scroll {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        padding-right: 4px;
    }

    .admin-item-card {
        background: #15221d;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 1rem;
        cursor: pointer;
        transition: var(--transition-smooth);
        text-align: left;
    }

    .admin-item-card:hover {
        border-color: rgba(251, 191, 36, 0.4);
        transform: translateY(-2px);
    }

    .admin-item-card.active {
        border-color: var(--accent-primary);
        background: #1b2c25;
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .admin-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
    }

    .admin-item-title {
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 0.3rem;
        line-height: 1.4;
    }

    .admin-item-meta {
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        gap: 0.6rem;
    }

    /* 右側編輯工作區 */
    .admin-editor-panel {
        background: #0f1915;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 1.8rem;
        text-align: left;
    }

    .editor-section-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--accent-primary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.2rem;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .editor-meta-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        margin-bottom: 1.5rem;
    }

    .editor-field {
        margin-bottom: 1.5rem;
    }

    .editor-field-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
    }

    .editor-label {
        font-size: 0.95rem;
        font-weight: 700;
        color: #ffffff;
    }

    .btn-copy-ai {
        background: rgba(168, 85, 247, 0.15);
        border: 1px solid #a855f7;
        color: #c084fc;
        padding: 0.3rem 0.8rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
    }

    .btn-copy-ai:hover {
        background: #a855f7;
        color: #ffffff;
    }

    .editor-textarea {
        width: 100%;
        background: #080d0b;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        color: #ffffff;
        font-size: 1rem;
        line-height: 1.7;
        padding: 1rem;
        font-family: inherit;
        transition: var(--transition-smooth);
    }

    .editor-textarea:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
    }

    .template-chips-bar {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-bottom: 0.8rem;
    }

    .template-chip {
        padding: 0.3rem 0.75rem;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-secondary);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-smooth);
    }

    .template-chip:hover {
        background: rgba(251, 191, 36, 0.15);
        border-color: var(--accent-primary);
        color: var(--accent-primary);
    }

    .editor-action-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .editor-action-left {
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .editor-action-right {
        display: flex;
        gap: 0.8rem;
    }

    .btn-save-publish {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        padding: 0.8rem 2rem;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: 800;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        transition: var(--transition-smooth);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    .btn-save-publish:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
    }

    /* 附議審查清單卡片樣式 */
    .sub-proposals-section {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .sub-proposal-card {
        background: #0d1613;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1.2rem;
        margin-bottom: 1rem;
        transition: var(--transition-smooth);
    }
    
    .sub-proposal-card:hover {
        border-color: rgba(251, 191, 36, 0.3);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    
    .sub-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.8rem;
        flex-wrap: wrap;
        gap: 0.5rem;
    }
    
    .sub-card-author {
        font-weight: 700;
        color: var(--accent-primary);
        font-size: 0.95rem;
    }
    
    .sub-card-meta {
        font-size: 0.82rem;
        color: var(--text-muted);
        display: flex;
        gap: 0.8rem;
    }
    
    .sub-card-body {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #e5e7eb;
        background: rgba(0, 0, 0, 0.25);
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 0.9rem;
        white-space: pre-wrap;
        border-left: 3px solid var(--accent-secondary);
    }
    
    .sub-card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.6rem;
    }
    
    .btn-sub-action {
        padding: 0.35rem 0.8rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
        border: none;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
    }
    
    .btn-sub-approve {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid #10b981;
        color: #34d399;
    }
    .btn-sub-approve:hover {
        background: #10b981;
        color: #0b1411;
    }
    
    .btn-sub-archive {
        background: rgba(156, 163, 175, 0.15);
        border: 1px solid #6b7280;
        color: #9ca3af;
    }
    .btn-sub-archive:hover {
        background: #6b7280;
        color: #ffffff;
    }
    </style>
</head>
<body class="admin-body">

    <!-- 密碼登入視窗 (預設密碼驗證) -->
    <div class="admin-login-overlay" id="admin-login-overlay">
        <div class="admin-login-card">
            <div class="logo" style="justify-content:center; margin-bottom:1rem;">
                <span class="logo-icon"></span>
                <span class="logo-text">
                    <span class="logo-main">明德里</span>
                    <span class="logo-sub">2.0</span>
                </span>
            </div>
            <h2>競選總部 ‧ 提案管理後台</h2>
            <p>請輸入管理員專屬 PIN 密碼解鎖工作台</p>
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                <div class="form-group" style="margin-bottom:1.5rem;">
                    <input type="password" id="admin-password-input" class="form-control" placeholder="請輸入管理密碼..." autofocus required style="font-size:1.2rem; text-align:center; letter-spacing:0.1em; padding:0.9rem;">
                </div>
                <div id="login-error-msg" style="color:#ef4444; font-size:0.88rem; font-weight:700; margin-bottom:1rem; display:none;">密碼錯誤，請重新輸入</div>
                <button type="submit" class="submit-btn" style="width:100%;">解鎖進入後台</button>
            </form>
        </div>
    </div>

    <!-- 後台頂部導覽列 -->
    <header class="admin-navbar">
        <div class="admin-nav-left">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
                <span class="logo-icon"></span>
                <span class="logo-text">
                    <span class="logo-main">明德里</span>
                    <span class="logo-sub">2.0</span>
                </span>
            </div>
            <span class="admin-badge-title">後台管理系統</span>
        </div>
        <div class="admin-nav-right">
            <button class="btn-admin-action btn-admin-primary" onclick="handleNewProposal()">+ 新增提案題目</button>
            <button class="btn-admin-action btn-admin-sync" id="btn-refresh-sheets" onclick="downloadFromGoogleSheets()" title="刷新取得最新里民提案">🔄 刷新案件</button>
            <button class="btn-admin-action btn-admin-sync" id="btn-upload-sheets" onclick="uploadAllToGoogleSheets()" title="將所有案件狀態同步推送至 Google 試算表">📤 批量上傳雲端</button>
            <button class="btn-admin-action btn-admin-logout" onclick="handleAdminLogout()">🚪 登出</button>
        </div>
    </header>

    <!-- 工作台雙欄排版 -->
    <main class="admin-workspace">
        <!-- 左側：清單與篩選 -->
        <aside class="admin-list-panel">
            <div class="admin-filter-tabs">
                <button class="admin-filter-btn active" data-filter="all" onclick="setAdminFilter('all', this)">全部 (<span id="count-all">0</span>)</button>
                <button class="admin-filter-btn" data-filter="pending" onclick="setAdminFilter('pending', this)">待審核 (<span id="count-pending">0</span>)</button>
                <button class="admin-filter-btn" data-filter="approved" onclick="setAdminFilter('approved', this)">已公開 (<span id="count-approved">0</span>)</button>
            </div>
            <input type="text" id="admin-search" class="admin-search-input" placeholder="🔍 搜尋提案人、關鍵字、ID..." oninput="handleAdminSearch(this.value)">
            
            <div class="admin-cards-scroll" id="admin-card-list">
                <!-- Injected dynamically by admin.js -->
            </div>
        </aside>

        <!-- 右側：編輯與官方回覆工作區 -->
        <section class="admin-editor-panel" id="admin-editor-panel">
            <div class="editor-section-title">
                <span>📝 提案審查與回覆編輯工作區</span>
                <div style="display:flex; align-items:center; gap:0.6rem;">
                    <span id="editor-active-id" style="font-size:0.9rem; color:var(--text-muted); font-family:monospace;">qa-1</span>
                </div>
            </div>

            <!-- 一鍵審核發布快捷操作橫幅 -->
            <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:0.8rem 1rem; margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem;">
                <div style="display:flex; align-items:center; gap:0.6rem;">
                    <span style="font-size:0.88rem; color:var(--text-secondary); font-weight:700;">目前前台公開狀態：</span>
                    <span id="editor-status-indicator" style="font-size:0.88rem; font-weight:800; padding:0.2rem 0.6rem; border-radius:6px; background:rgba(16,185,129,0.15); color:#34d399; border:1px solid #10b981;">🟢 已審核公開</span>
                </div>
                <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <button type="button" class="btn-admin-action" id="btn-quick-approve" onclick="handleQuickStatusChange('已審核公開')" style="background:#10b981; color:#060b09; font-weight:800;">
                        ✓ 一鍵審核公開
                    </button>
                    <button type="button" class="btn-admin-action" id="btn-quick-pending" onclick="handleQuickStatusChange('待決策小組審核')" style="background:rgba(239,68,68,0.15); border:1px solid #ef4444; color:#f87171;">
                        ✕ 設為待審核
                    </button>
                    <button type="button" class="btn-admin-action" id="btn-quick-archive" onclick="handleQuickStatusChange('已封存')" style="background:rgba(156,163,175,0.15); border:1px solid #6b7280; color:#9ca3af;">
                        ⚪ 封存
                    </button>
                </div>
            </div>

            <div class="editor-meta-grid">
                <div class="form-group">
                    <label class="editor-label">稱謂 / 社區（可編輯）</label>
                    <input type="text" id="edit-author" class="form-control" style="padding:0.6rem 0.8rem;">
                </div>
                <div class="form-group">
                    <label class="editor-label">議題分類標籤</label>
                    <select id="edit-category" class="form-control" style="background:#080d0b; padding:0.6rem 0.8rem;">
                        <option value="#巷弄安全與照明">#巷弄安全與照明</option>
                        <option value="#跨世代共融與課程">#跨世代共融與課程</option>
                        <option value="#交通號誌與停車">#交通號誌與停車</option>
                        <option value="#環境衛生與整潔">#環境衛生與整潔</option>
                        <option value="#社區法規與大樓共好">#社區法規與大樓共好</option>
                        <option value="#其他生活建議">#其他生活建議</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="editor-label">審核處置狀態</label>
                    <select id="edit-status" class="form-control" style="background:#080d0b; padding:0.6rem 0.8rem;" onchange="updateEditorStatusIndicator(this.value)">
                        <option value="已審核公開">🟢 已審核公開</option>
                        <option value="待決策小組審核">🔴 待決策小組審核</option>
                        <option value="已封存">⚪ 已封存備查</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="editor-label">前台分類標籤</label>
                    <select id="edit-type" class="form-control" style="background:#080d0b; padding:0.6rem 0.8rem;">
                        <option value="policy">已納入政見（綠色）</option>
                        <option value="inspect">重點會勘（橘色）</option>
                        <option value="city">專案爭取（紫色）</option>
                        <option value="law">法規解答（藍色）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="editor-label">聯絡方式（選民個資）</label>
                    <input type="text" id="edit-contact" class="form-control" placeholder="Email 或電話..." style="padding:0.6rem 0.8rem;">
                </div>
                <div class="form-group">
                    <label class="editor-label">提交時間</label>
                    <input type="text" id="edit-date" class="form-control" readonly style="background:rgba(255,255,255,0.03); color:var(--text-muted); padding:0.6rem 0.8rem;">
                </div>
            </div>

            <!-- 里民問題編輯區 -->
            <div class="editor-field">
                <div class="editor-field-header">
                    <label class="editor-label">里民問題 / 提案原文（現階段支援編輯潤飾）：</label>
                    <button class="btn-copy-ai" onclick="copyQuestionToAI()">📋 複製問題給 AI 諮詢</button>
                </div>
                <textarea id="edit-question" class="editor-textarea" rows="4" placeholder="里民反映之問題全文..."></textarea>
            </div>

            <!-- 官方回覆編輯區 -->
            <div class="editor-field">
                <div class="editor-field-header">
                    <label class="editor-label">陳新昱 官方具體解決路徑回覆（支援分段與條列）：</label>
                    <button class="btn-copy-ai" onclick="copyResponseToAI()">📋 複製官方回覆</button>
                </div>

                <!-- 快捷 SOP 範本工具箱 -->
                <div class="template-chips-bar">
                    <span style="font-size:0.8rem; color:var(--text-muted); align-self:center;">⚡ 快捷 SOP 範本：</span>
                    <span class="template-chip" onclick="insertTemplate('inspect')">＋ 優先重點會勘</span>
                    <span class="template-chip" onclick="insertTemplate('policy')">＋ 既有承諾延續</span>
                    <span class="template-chip" onclick="insertTemplate('law')">＋ 市府法規解答</span>
                    <span class="template-chip" onclick="insertTemplate('city')">＋ 市府專案爭取</span>
                </div>

                <textarea id="edit-response" class="editor-textarea" rows="6" placeholder="請輸入官方具體回覆或點擊上方快捷 SOP 範本..."></textarea>
            </div>

            <!-- 在地現況補充與附議審查清單 -->
            <div class="sub-proposals-section" id="sub-proposals-section">
                <div class="editor-section-title" style="margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center;">
                    <span>📍 在地現況補充與附議審查清單 (<span id="sub-count-display">0</span>)</span>
                    <span style="font-size:0.82rem; color:var(--text-muted); font-weight:normal;">里民回報之即時路況/時段補充</span>
                </div>
                <div id="sub-proposals-container">
                    <!-- Injected dynamically by admin.js -->
                </div>
            </div>

            <!-- 底部操作列 -->
            <div class="editor-action-bar">
                <div class="editor-action-left">
                    <button class="btn-copy-ai" style="padding:0.6rem 1.2rem; font-size:0.92rem;" onclick="copyFullQAToAI()">
                        📋 一鍵複製完整問答給 AI
                    </button>
                </div>
                <div class="editor-action-right" style="display:flex; gap:0.8rem; align-items:center;">
                    <button class="btn-save-publish" onclick="handleSaveProposal()">
                        <span>💾 儲存案件並同步雲端</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notice -->
    <div class="toast-notice" id="toast-notice" role="alert" aria-live="polite">
        <span class="toast-icon">✓</span>
        <span id="toast-msg">已成功複製至剪貼簿！</span>
    </div>

    <script src="js/admin.js?v=7.00"></script>
</body>
</html>
